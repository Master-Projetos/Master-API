[project]
name = 'leclerc-api'
version = '0.8.3'
description = 'API que ingloba todos os KPIS da master'
authors = [
    {name = 'Eduardo',email = 'eduardo.vchaves23@gmail.com'}
]

requires-python = '>=3.15,<4.0'
dependencies = [
    'requests (>=2.32.0,<3.0.0)',
    "pandas (==3.1.0)",
    "fastapi[standard] (>=0.162.0,<0.163.0)",
    'slowapi (>=0.1.10,<0.2.0)',
    "sqlalchemy[asyncio] (==2.1.6)",
    "pwdlib[argon2] (>=0.3.1,<0.4.0)",
    "psycopg[binary] (>=3.3.6,<4.0.0)",
    "alembic (==1.20.1)",
    "pyjwt (>=2.15.1,<3.0.0)",
    "openpyxl (>=3.1.5,<4.0.0)",
    "pydantic (==2.14.1)",
    "pydantic-settings (>=2.16.1,<3.0.0)",
    "ruff (==0.17.2)",
]

[build-system]
requires = ['hatchling']
build-backend = 'hatchling.build'

[dependency-groups]
dev = [
    'ruff (>=0.17.0,<0.18.0)',
    'taskipy (>=1.14.1,<2.0.0)',
    "pytest (>=9.1.1,<10.0.0)",
    "aiosqlite (>=0.22.1,<0.23.0)"
]

[tool.poetry]
package-mode = false

[tool.hatch.build.targets.wheel]
packages = ['core', 'api']

[tool.taskipy.tasks]
dev = 'fastapi dev'
lint = 'ruff check .'
format = 'ruff format .'
pos_format = 'ruff check . --fix'
pre_tests = 'task format'
tests = 'pytest -s -x -v'

[tool.pytest.ini_options]
testpaths = ['tests']
pythonpath = ['.']

[tool.ruff]
line-length = 79
extend-exclude = []

[tool.ruff.lint]
preview = true
select = ['I', 'F', 'E', 'W', 'PL', 'PT', 'FAST']

[tool.ruff.format]
preview = true
quote-style = 'single'
